name: CI

on:
  push:
    branches:
      - main
      - review/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test Go
        run: go test -race ./...

      - name: Check extension syntax
        run: |
          for file in extension/*.js; do
            node --check "$file"
          done

      - name: Test extension
        run: node --test extension/test/*.test.js

      - name: Build
        run: go build -trimpath -o dist/riflo ./cmd/riflo
